<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="100%" height="100%" style="background-color:#0b0f19; font-family:'Segoe UI', Helvetica, Arial, sans-serif;">
  <!-- Title -->
  <text x="50" y="45" fill="#ffffff" font-size="20" font-weight="bold">Growth OS - 5D Framework Flow Diagram</text>
  <text x="50" y="70" fill="#94a3b8" font-size="12">Interactive loops connecting onboarding, multi-agent reasoning, execution tracking, and performance dominance</text>
  
  <!-- Flow Steps (Cards) -->
  <!-- 1. Discover -->
  <g transform="translate(50, 120)">
    <rect x="0" y="0" width="140" height="150" rx="16" fill="#1e1b4b" stroke="#4f46e5" stroke-width="2" />
    <text x="70" y="35" fill="#c7d2fe" font-size="14" font-weight="bold" text-anchor="middle">1. DISCOVER</text>
    <text x="70" y="65" fill="#f8fafc" font-size="11" text-anchor="middle">Onboarding Form</text>
    <text x="70" y="85" fill="#94a3b8" font-size="10" text-anchor="middle">Company Profiles</text>
    <text x="70" y="105" fill="#94a3b8" font-size="10" text-anchor="middle">Goal Selections</text>
    <text x="70" y="125" fill="#94a3b8" font-size="10" text-anchor="middle">Optional CSV Input</text>
  </g>

  <!-- 2. Design -->
  <g transform="translate(230, 120)">
    <rect x="0" y="0" width="140" height="150" rx="16" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <text x="70" y="35" fill="#cbd5e1" font-size="14" font-weight="bold" text-anchor="middle">2. DESIGN</text>
    <text x="70" y="65" fill="#f8fafc" font-size="11" text-anchor="middle">Analysis &amp; Strategy</text>
    <text x="70" y="85" fill="#94a3b8" font-size="10" text-anchor="middle">Data Analyst Agent</text>
    <text x="70" y="105" fill="#94a3b8" font-size="10" text-anchor="middle">Serper Competitors</text>
    <text x="70" y="125" fill="#94a3b8" font-size="10" text-anchor="middle">Strategy Formulate</text>
  </g>

  <!-- 3. Deliver -->
  <g transform="translate(410, 120)">
    <rect x="0" y="0" width="140" height="150" rx="16" fill="#581c87" stroke="#9333ea" stroke-width="2" />
    <text x="70" y="35" fill="#f3e8ff" font-size="14" font-weight="bold" text-anchor="middle">3. DELIVER</text>
    <text x="70" y="65" fill="#f8fafc" font-size="11" text-anchor="middle">Plays &amp; Campaigns</text>
    <text x="70" y="85" fill="#e9d5ff" font-size="10" text-anchor="middle">Marketing Agent</text>
    <text x="70" y="105" fill="#e9d5ff" font-size="10" text-anchor="middle">Sales Agent plays</text>
    <text x="70" y="125" fill="#94a3b8" font-size="10" text-anchor="middle">Recommendation Feed</text>
  </g>

  <!-- 4. Develop -->
  <g transform="translate(590, 120)">
    <rect x="0" y="0" width="140" height="150" rx="16" fill="#022c22" stroke="#0d9488" stroke-width="2" />
    <text x="70" y="35" fill="#ccfbf1" font-size="14" font-weight="bold" text-anchor="middle">4. DEVELOP</text>
    <text x="70" y="65" fill="#f8fafc" font-size="11" text-anchor="middle">Feedback Loop</text>
    <text x="70" y="85" fill="#99f6e4" font-size="10" text-anchor="middle">Log Actual Metrics</text>
    <text x="70" y="105" fill="#99f6e4" font-size="10" text-anchor="middle">Finance Recompute</text>
    <text x="70" y="125" fill="#99f6e4" font-size="10" text-anchor="middle">CEO Recalibrate</text>
  </g>

  <!-- 5. Dominate -->
  <g transform="translate(770, 120)">
    <rect x="0" y="0" width="140" height="150" rx="16" fill="#062f4f" stroke="#0284c7" stroke-width="2" />
    <text x="70" y="35" fill="#e0f2fe" font-size="14" font-weight="bold" text-anchor="middle">5. DOMINATE</text>
    <text x="70" y="65" fill="#f8fafc" font-size="11" text-anchor="middle">Growth Dashboard</text>
    <text x="70" y="85" fill="#94a3b8" font-size="10" text-anchor="middle">9 Required Panels</text>
    <text x="70" y="105" fill="#94a3b8" font-size="10" text-anchor="middle">Recharts Visuals</text>
    <text x="70" y="125" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">AI Copilot Chat</text>
  </g>

  <!-- Flow Arrows (Connecting cards) -->
  <!-- 1 -> 2 -->
  <path d="M 190 195 L 230 195" fill="none" stroke="#4f46e5" stroke-width="3" marker-end="url(#arrow)" />
  <!-- 2 -> 3 -->
  <path d="M 370 195 L 410 195" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" />
  <!-- 3 -> 5 -->
  <path d="M 550 195 L 770 195" fill="none" stroke="#9333ea" stroke-width="3" />
  <!-- 4 -> 2 (recompute loop) -->
  <path d="M 660 270 L 660 300 L 300 300 L 300 270" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-dasharray="4 4" marker-end="url(#arrow-reverse)" />
  <text x="480" y="318" fill="#0d9488" font-size="11" font-weight="bold" text-anchor="middle">Develop Recomputes &amp; Feeds back to Strategy/CEO</text>

  <!-- 5 -> 4 -->
  <path d="M 840 270 L 840 300 L 700 300" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-dasharray="4 4" />

  <!-- Arrow marker definitions -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
    <marker id="arrow-reverse" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#0d9488" />
    </marker>
  </defs>
</svg>
