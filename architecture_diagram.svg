<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background-color:#0b0f19; font-family:'Segoe UI', Helvetica, Arial, sans-serif;">
  <!-- Title -->
  <text x="50" y="50" fill="#ffffff" font-size="24" font-weight="bold">Growth OS - Architecture Diagram</text>
  <text x="50" y="75" fill="#94a3b8" font-size="14">Technical layout of components, databases, agent layers, and external grounding</text>
  
  <!-- Outer boundaries / Subgraphs -->
  <!-- User/Browser -->
  <rect x="50" y="120" width="160" height="470" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <text x="130" y="150" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle">Client Layer</text>
  
  <!-- Backend App -->
  <rect x="250" y="120" width="460" height="470" rx="16" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
  <text x="480" y="150" fill="#f8fafc" font-size="16" font-weight="bold" text-anchor="middle">FastAPI Application Server</text>
  
  <!-- External API -->
  <rect x="750" y="120" width="200" height="150" rx="16" fill="#1e1b4b" stroke="#312e81" stroke-width="2" />
  <text x="850" y="150" fill="#a5b4fc" font-size="16" font-weight="bold" text-anchor="middle">External Layer</text>

  <!-- Database & Vector Store -->
  <rect x="750" y="300" width="200" height="290" rx="16" fill="#064e3b" stroke="#065f46" stroke-width="2" />
  <text x="850" y="330" fill="#a7f3d0" font-size="16" font-weight="bold" text-anchor="middle">Data &amp; Knowledge</text>

  <!-- Internal Components -->
  <!-- Frontend Browser -->
  <rect x="70" y="260" width="120" height="180" rx="12" fill="#020617" stroke="#38bdf8" stroke-width="2" />
  <text x="130" y="300" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle">Next.js Web</text>
  <text x="130" y="325" fill="#94a3b8" font-size="12" text-anchor="middle">Tailwind CSS</text>
  <text x="130" y="345" fill="#94a3b8" font-size="12" text-anchor="middle">Recharts Panels</text>
  <text x="130" y="365" fill="#94a3b8" font-size="12" text-anchor="middle">Copilot UI</text>
  <text x="130" y="385" fill="#94a3b8" font-size="12" text-anchor="middle">Log actuals</text>

  <!-- FastAPI Router -->
  <rect x="270" y="180" width="180" height="380" rx="12" fill="#020617" stroke="#4ade80" stroke-width="2" />
  <text x="360" y="215" fill="#4ade80" font-size="14" font-weight="bold" text-anchor="middle">FastAPI Router</text>
  <text x="360" y="250" fill="#f8fafc" font-size="12" text-anchor="middle">POST /api/onboarding</text>
  <text x="360" y="280" fill="#f8fafc" font-size="12" text-anchor="middle">GET /api/dashboard</text>
  <text x="360" y="310" fill="#f8fafc" font-size="12" text-anchor="middle">POST /api/metrics/update</text>
  <text x="360" y="340" fill="#f8fafc" font-size="12" text-anchor="middle">POST /api/copilot/chat</text>
  
  <!-- Orchestrator & Agents -->
  <rect x="490" y="180" width="200" height="380" rx="12" fill="#020617" stroke="#a855f7" stroke-width="2" />
  <text x="590" y="215" fill="#a855f7" font-size="14" font-weight="bold" text-anchor="middle">Agent Orchestrator</text>
  <rect x="505" y="240" width="170" height="35" rx="6" fill="#1e293b" />
  <text x="590" y="262" fill="#f1f5f9" font-size="12" font-weight="bold" text-anchor="middle">CEO Agent</text>
  
  <rect x="505" y="285" width="170" height="35" rx="6" fill="#1e293b" />
  <text x="590" y="307" fill="#f1f5f9" font-size="12" text-anchor="middle">Data Analyst Agent</text>
  
  <rect x="505" y="330" width="170" height="35" rx="6" fill="#1e293b" />
  <text x="590" y="352" fill="#f1f5f9" font-size="12" text-anchor="middle">Strategy Agent</text>
  
  <rect x="505" y="375" width="170" height="35" rx="6" fill="#1e293b" />
  <text x="590" y="397" fill="#f1f5f9" font-size="12" text-anchor="middle">Marketing Agent</text>

  <rect x="505" y="420" width="170" height="35" rx="6" fill="#1e293b" />
  <text x="590" y="442" fill="#f1f5f9" font-size="12" text-anchor="middle">Sales Agent</text>

  <rect x="505" y="465" width="170" height="35" rx="6" fill="#1e293b" />
  <text x="590" y="487" fill="#f1f5f9" font-size="12" text-anchor="middle">Finance Agent</text>

  <!-- External Connections -->
  <!-- Serper.dev -->
  <rect x="770" y="170" width="160" height="35" rx="8" fill="#312e81" stroke="#4f46e5" stroke-width="1.5" />
  <text x="850" y="192" fill="#e0e7ff" font-size="12" font-weight="bold" text-anchor="middle">Serper.dev Search</text>

  <!-- Gemini API -->
  <rect x="770" y="215" width="160" height="35" rx="8" fill="#312e81" stroke="#4f46e5" stroke-width="1.5" />
  <text x="850" y="237" fill="#e0e7ff" font-size="12" font-weight="bold" text-anchor="middle">Google Gemini API</text>

  <!-- SQLite Database -->
  <rect x="770" y="360" width="160" height="45" rx="8" fill="#065f46" stroke="#34d399" stroke-width="1.5" />
  <text x="850" y="380" fill="#e6f4ea" font-size="12" font-weight="bold" text-anchor="middle">SQLite Database</text>
  <text x="850" y="395" fill="#a7f3d0" font-size="10" text-anchor="middle">Structured Caching</text>

  <!-- Chroma Vector DB -->
  <rect x="770" y="425" width="160" height="45" rx="8" fill="#065f46" stroke="#34d399" stroke-width="1.5" />
  <text x="850" y="445" fill="#e6f4ea" font-size="12" font-weight="bold" text-anchor="middle">Chroma Vector DB</text>
  <text x="850" y="460" fill="#a7f3d0" font-size="10" text-anchor="middle">Context Indexing</text>

  <!-- ARROWS / CONNECTIONS -->
  <!-- Browser to Router -->
  <path d="M 190 350 L 270 350" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <text x="230" y="340" fill="#94a3b8" font-size="11" text-anchor="middle">HTTP</text>
  
  <!-- Router to Orchestrator -->
  <path d="M 450 350 L 490 350" fill="none" stroke="#64748b" stroke-width="2" />
  
  <!-- Strategy Agent to Serper -->
  <path d="M 690 347 L 730 347 L 730 188 L 770 188" fill="none" stroke="#a855f7" stroke-width="1.5" />
  
  <!-- Orchestrator to Gemini -->
  <path d="M 690 300 L 715 300 L 715 232 L 770 232" fill="none" stroke="#a855f7" stroke-width="1.5" />
  
  <!-- Orchestrator to SQLite -->
  <path d="M 690 400 L 735 400 L 735 382 L 770 382" fill="none" stroke="#10b981" stroke-width="1.5" />

  <!-- Orchestrator to Chroma -->
  <path d="M 690 435 L 770 435" fill="none" stroke="#10b981" stroke-width="1.5" />

  <!-- Marker definition -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b" />
    </marker>
  </defs>
</svg>
